name: Push-to-VPS

# Trigger deployment only on push to master branch
on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy to VPS on master branch push
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: NEWSUN API
      SECRET_KEY: 123456
      ENVIRONMENT: production

    steps:
      - name: Checkout the files
        uses: actions/checkout@v2

      - name: Create .env file
        run: |
          ls
          touch .env
          echo PROJECT_NAME=${{ env.PROJECT_NAME }} >> .env
          echo SECRET_KEY=${{ env.SECRET_KEY }} >> .env
          echo SQL_DATABASE_URL=${{ secrets.SQL_DATABASE_URL }} >> .env
          echo APP_USERNAME=${{ secrets.APP_USERNAME }} >> .env
          echo APP_PASSWORD=${{ secrets.APP_PASSWORD }} >> .env
          echo MINIO_ENDPOINT=${{ secrets.MINIO_ENDPOINT }} >> .env
          echo AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }} >> .env
          echo AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY }} >> .env
          echo AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY }} >> .env
          # Note: VPS SSH key and host are kept in GitHub Secrets and used only for SSH, not written to .env
          cat .env

      - name: Deploy to Server
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          TARGET: ~/backend

      - name: Dockerize on VPS
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/backend
            docker build -t fastapi-app .
            docker stop fastapi-container || true
            docker rm fastapi-container || true
            docker run -d -p 8000:8000 --name fastapi-container fastapi-app
            sudo systemctl restart nginx || true
